set-option -g default-command "zsh"
set-option -g prefix C-s
set-option -g default-terminal "xterm-256color"
set-option -g detach-on-destroy off
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -g mouse on
set -g focus-events on

set -s escape-time 10
set -sg repeat-time 0

set-option -g status-keys vi
set-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1

set -g visual-activity on
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'
set -g pane-active-border-style 'fg=#00cc66'

set -g status-style 'bg=#222222 fg=#00cc66'
set -g status-left-length 50
set -g status-left '#{?client_prefix,#[fg=red],#[fg=green]}[ #S ] '
set -g status-right '#[fg=#00cc66]%b-%d %H:%M '
set -g message-style 'fg=#00cc66 bg=#000000'
set-window-option -g clock-mode-colour colour64

setw -g window-status-separator ' '
setw -g window-status-format ' #[fg=#00cc66]#I #W '
setw -g window-status-current-style 'fg=#000000 bg=#00cc66 bold'
setw -g window-status-current-format ' #[fg=#000000,bg=#00cc66,bold]#I #W '

bind r source-file ~/.tmux.conf
bind-key r command-prompt "rename-window '%%'"
bind-key K command-prompt -p "Kill tmux server? (y/n)" "if-shell '[ \"%%\" = \"y\" ]' 'kill-server'"
bind-key X confirm-before -p "Kill current session #S? (y/n)" "kill-session"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key -n C-Right next-window
bind-key -n C-Left previous-window
bind Space last-window
bind-key C-Space switch-client -l
bind-key -n C-Up switch-client -n
bind-key -n C-Down switch-client -p

bind-key -r G new-window -c "#{pane_current_path}" -n "LazyGit" "lazygit"
bind-key N run-shell "~/scripts/open-nvim"

bind-key -r i new-window -n "instructions" "~/scripts/instructions.sh"
bind-key -r p new-window -n "prompts" "~/scripts/prompts.sh"
bind-key -r T new-window -n "sisyphus" "~/scripts/sisyphus"
bind-key -r f new-window -n "sessionizer" "~/scripts/sessionizer"
bind-key -r a new-window -n "newproject" "~/scripts/newproject"
bind-key -r g new-window -n "grepforllm" "~/scripts/grepforllm"
